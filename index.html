<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Futbolín Tricolor - Entrena Consulting SAS</title>

    <style>
        :root { --p1: #d32f2f; --p2: #1976d2; --gold: #fbc02d; }
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body {
            background: #121212; margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            touch-action: pan-x pan-y; /* Permite scroll pero no zoom */
        }

        /* Overlay de rotación SUGERENCIA (no bloqueante) */
        #rotate-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 3000;
            flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center;
        }
        
        #rotate-overlay button {
            margin-top: 20px; padding: 12px 24px;
            background: var(--gold); border: none; border-radius: 30px;
            font-weight: bold; cursor: pointer;
        }

        /* Solo mostrar sugerencia en portrait, pero NO BLOQUEAR */
        @media (orientation: portrait) {
            #rotate-overlay { display: flex; }
            .game-container { filter: blur(2px); pointer-events: none; }
        }
        
        @media (orientation: landscape) {
            #rotate-overlay { display: none !important; }
            .game-container { filter: none; pointer-events: auto; }
        }

        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2e7d32, #1a1a1a);
            color: white; z-index: 2000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }

        .game-container {
            position: relative; display: flex; flex-direction: column;
            width: 95vw; max-width: 820px;
            background: #3e2723; padding: 8px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 4px solid #2d1b18;
            margin: 10px;
        }

        .ui-top {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px; color: #fff; width: 100%; flex-shrink: 0;
            gap: 8px;
        }

        .stat-box {
            background: #2d1b18; padding: 8px 12px; border-radius: 15px;
            font-weight: bold; border: 1px solid #5d4037;
            font-size: clamp(12px, 4vw, 16px);
            text-align: center;
        }

        .turn { transition: 0.3s; }
        .p1-active { background: var(--p1); box-shadow: 0 0 10px var(--p1); }
        .p2-active { background: var(--p2); box-shadow: 0 0 10px var(--p2); }

        canvas {
            display: block; background: #bcaaa4; border-radius: 5px;
            touch-action: none; /* Solo el canvas captura toques */
            width: 100%; height: auto;
            cursor: crosshair;
            aspect-ratio: 800 / 520;
        }

        .control-bar {
            display: flex; gap: 10px; margin-top: 8px;
            justify-content: center; flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer;
            border-radius: 30px; border: none; background: var(--gold); color: #000;
            transition: transform 0.1s;
        }
        
        .btn:active { transform: scale(0.96); }

        #winnerVignette {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; border-radius: 10px;
            flex-direction: column; justify-content: center; align-items: center; color: white;
            text-align: center;
        }
        
        @media (max-width: 600px) {
            .stat-box { padding: 4px 8px; font-size: 12px; }
            .btn { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

<!-- Overlay NO BLOQUEANTE de rotación -->
<div id="rotate-overlay">
    <div style="font-size: 50px;">🔄</div>
    <p style="margin: 10px;">GIRA tu dispositivo para mejor experiencia</p>
    <button id="closeRotateBtn">CONTINUAR ASÍ</button>
</div>

<div id="splash-screen">
    <div style="font-size: 12px; letter-spacing: 2px;">BIENVENIDOS A</div>
    <h1 style="color:var(--gold); margin:10px 0; font-size: clamp(20px, 6vw, 32px);">ENTRENA CONSULTING SAS</h1>
    <p style="margin-bottom:20px;">Expertos en SST</p>
    <button class="btn" id="startBtn">INICIAR DUELO</button>
</div>

<div class="game-container">
    <div class="ui-top">
        <div id="turnText" class="stat-box turn p1-active">Turno: J1</div>
        <div class="stat-box" style="color:var(--gold)">⚽ <span id="score1">0</span> - <span id="score2">0</span></div>
        <div class="stat-box">⏱️ <span id="timer">60</span>s</div>
    </div>

    <canvas id="gameCanvas" width="800" height="520"></canvas>

    <div class="control-bar">
        <button class="btn" id="fullscreenBtn">⛶ Pantalla completa</button>
        <button class="btn" id="resetGameBtn">🔄 Reiniciar</button>
    </div>

    <div id="winnerVignette">
        <h2 id="winnerText" style="color:var(--gold); font-size: 40px;"></h2>
        <p>Entrena Consulting SAS</p>
        <button class="btn" onclick="location.reload()">JUGAR DE NUEVO</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 520;

    const PHYSICS = { friction: 0.988, wallBounce: 0.6, pinBounce: 0.82, powerMult: 0.14 }; // Ajustado para móvil
    let score = [0, 0], currentPlayer = 1, timeLeft = 60, isMoving = false, isDragging = false;
    let gameActive = false, dragCurrent = {x:0,y:0}, timerInterval;

    let ball = { x: 65, y: H/2, vx: 0, vy: 0, radius: 14, angle: 0 };
    const pins = [];
    const PIN_RADIUS = 8;

    // Función mejorada para obtener coordenadas (compatible touch/ratón)
    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        
        let clientX, clientY;
        
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        
        let x = (clientX - rect.left) * scaleX;
        let y = (clientY - rect.top) * scaleY;
        
        return { x: Math.min(Math.max(0, x), W), y: Math.min(Math.max(0, y), H) };
    }

    function initField() {
        pins.length = 0;
        const createFormation = (dir) => {
            const baseX = dir === 1 ? W * 0.1 : W * 0.9;
            const s = dir === 1 ? 75 : -75;
            pins.push({ x: dir === 1 ? 25 : W-25, y: H/2 }); 
            [0.2, 0.4, 0.6, 0.8].forEach(p => pins.push({ x: baseX + s, y: H*p }));
            [0.3, 0.5, 0.7].forEach(p => pins.push({ x: baseX + s*2.5, y: H*p }));
            pins.push({ x: baseX + s*3.8, y: H/2 });
            [0.38, 0.62].forEach(p => pins.push({ x: baseX + s*5.2, y: H*p }));
        };
        createFormation(1); 
        createFormation(-1);
    }

    function drawMarble(b) {
        ctx.save(); ctx.translate(b.x, b.y);
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath();
        ctx.arc(b.vx, b.vy + 5, b.radius, 0, Math.PI*2); ctx.fill();

        ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI*2);
        let g = ctx.createRadialGradient(-3, -3, 0, 0, 0, b.radius);
        g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#b2dfdb');
        ctx.fillStyle = g; ctx.fill();

        ctx.rotate(b.angle);
        const tricolor = ['#fbc02d', '#1976d2', '#d32f2f']; 
        tricolor.forEach((col, i) => {
            ctx.save(); ctx.rotate((Math.PI * 2 / 3) * i);
            ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, 0);
            ctx.bezierCurveTo(b.radius * 0.8, -b.radius * 0.5, b.radius * 0.8, b.radius * 0.5, 0, 0);
            ctx.fill(); ctx.restore();
        });

        ctx.restore(); ctx.save(); ctx.translate(b.x, b.y);
        let shine = ctx.createRadialGradient(-b.radius/2.5, -b.radius/2.5, 1, 0, 0, b.radius);
        shine.addColorStop(0, 'rgba(255,255,255,0.8)'); shine.addColorStop(1, 'rgba(0,0,0,0.05)');
        ctx.fillStyle = shine; ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function update() {
        if (!gameActive) return;
        
        if (isMoving) {
            const speed = Math.hypot(ball.vx, ball.vy);
            ball.angle += speed * 0.08;
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vx *= PHYSICS.friction;
            ball.vy *= PHYSICS.friction;

            // Bordes superior e inferior
            if (ball.y < ball.radius || ball.y > H - ball.radius) {
                ball.vy *= -PHYSICS.wallBounce;
                ball.y = ball.y < ball.radius ? ball.radius : H - ball.radius;
            }
            
            // Goles en los extremos
            const goalZone = 70;
            const isGoal = (ball.x < 25 && Math.abs(ball.y - H/2) < goalZone) ||
                          (ball.x > W - 25 && Math.abs(ball.y - H/2) < goalZone);
            
            if (isGoal) {
                if (ball.x < W/2) { 
                    score[1]++;  // Gol del J2
                    currentPlayer = 1;
                } else { 
                    score[0]++;  // Gol del J1
                    currentPlayer = 2;
                }
                updateUI();
                resetBallPosition();
                return;
            } 
            // Rebote en paredes laterales (fuera de portería)
            else if (ball.x < ball.radius || ball.x > W - ball.radius) {
                ball.vx *= -PHYSICS.wallBounce;
                ball.x = ball.x < ball.radius ? ball.radius : W - ball.radius;
            }

            // Colisión con pinos
            pins.forEach(p => {
                const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy);
                if (d < ball.radius + PIN_RADIUS) {
                    const ang = Math.atan2(dy, dx);
                    const s = Math.hypot(ball.vx, ball.vy);
                    ball.vx = Math.cos(ang) * s * PHYSICS.pinBounce;
                    ball.vy = Math.sin(ang) * s * PHYSICS.pinBounce;
                    const overlap = (ball.radius + PIN_RADIUS) - d;
                    ball.x += Math.cos(ang) * overlap;
                    ball.y += Math.sin(ang) * overlap;
                }
            });

            // Detener movimiento
            if (Math.hypot(ball.vx, ball.vy) < 0.2) { 
                isMoving = false; 
                currentPlayer = (currentPlayer === 1) ? 2 : 1; 
                updateUI(); 
            }
        }
    }

    function draw() {
        ctx.fillStyle = '#5d4037';
        ctx.fillRect(0, 0, W, H);
        
        // Líneas de la cancha
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 2;
        ctx.strokeRect(15, 15, W-30, H-30);
        ctx.beginPath();
        ctx.moveTo(W/2, 0);
        ctx.lineTo(W/2, H);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(W/2, H/2, 60, 0, Math.PI*2);
        ctx.stroke();

        // Textos
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.textAlign = 'center';
        ctx.font = 'bold 24px Arial';
        ctx.fillText('ENTRENA CONSULTING SAS', W/2, H - 40);
        ctx.font = 'bold 18px Arial';
        ctx.fillStyle = currentPlayer === 1 ? 'var(--p1)' : '#aaa';
        ctx.fillText('JUGADOR 1', W*0.25, 45);
        ctx.fillStyle = currentPlayer === 2 ? 'var(--p2)' : '#aaa';
        ctx.fillText('JUGADOR 2', W*0.75, 45);

        // Porterías
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 3;
        ctx.strokeRect(-5, H/2-60, 30, 120);
        ctx.strokeRect(W-25, H/2-60, 30, 120);

        // Pinos
        pins.forEach(p => {
            ctx.fillStyle = '#2c2c2c';
            ctx.beginPath();
            ctx.arc(p.x, p.y, PIN_RADIUS, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#555';
            ctx.beginPath();
            ctx.arc(p.x-1, p.y-1, 2, 0, Math.PI*2);
            ctx.fill();
        });

        // Línea de tiro
        if (isDragging && !isMoving) {
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255, 215, 0, 0.7)';
            ctx.setLineDash([5, 8]);
            ctx.lineWidth = 3;
            ctx.moveTo(ball.x, ball.y);
            ctx.lineTo(ball.x + (ball.x - dragCurrent.x) * 2, 
                      ball.y + (ball.y - dragCurrent.y) * 2);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // Indicador de fuerza
            let force = Math.min(Math.hypot(ball.x - dragCurrent.x, ball.y - dragCurrent.y), 80);
            ctx.fillStyle = `rgba(255, 215, 0, ${force/100})`;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, 15 + force/3, 0, Math.PI*2);
            ctx.fill();
        }

        drawMarble(ball);
        update();
        requestAnimationFrame(draw);
    }

    function startGame() {
        document.getElementById('splash-screen').style.display = 'none';
        gameActive = true;
        score = [0, 0];
        currentPlayer = 1;
        timeLeft = 60;
        updateUI();
        resetBallPosition();
        startTimer();
    }

    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!gameActive) return;
            if (timeLeft > 0) {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) endGame();
            }
        }, 1000);
    }

    function resetBallPosition() {
        isMoving = false;
        isDragging = false;
        ball.vx = 0;
        ball.vy = 0;
        ball.x = currentPlayer === 1 ? 65 : W - 65;
        ball.y = H/2;
        updateUI();
    }

    function updateUI() {
        document.getElementById('score1').innerText = score[0];
        document.getElementById('score2').innerText = score[1];
        const t = document.getElementById('turnText');
        t.innerText = `Turno: J${currentPlayer}`;
        t.className = `stat-box turn ${currentPlayer === 1 ? 'p1-active' : 'p2-active'}`;
    }

    function endGame() {
        gameActive = false;
        clearInterval(timerInterval);
        const vig = document.getElementById('winnerVignette');
        let win = score[0] > score[1] ? "🏆 VICTORIA JUGADOR 1 🏆" : 
                  (score[1] > score[0] ? "🏆 VICTORIA JUGADOR 2 🏆" : "🤝 EMPATE 🤝");
        document.getElementById('winnerText').innerHTML = win;
        vig.style.display = 'flex';
    }

    function resetGame() {
        if(timerInterval) clearInterval(timerInterval);
        score = [0, 0];
        currentPlayer = 1;
        timeLeft = 60;
        gameActive = true;
        isMoving = false;
        isDragging = false;
        resetBallPosition();
        updateUI();
        startTimer();
        document.getElementById('winnerVignette').style.display = 'none';
    }

    // MANEJADORES DE EVENTOS MEJORADOS PARA TÁCTIL
    function handleDown(e) { 
        e.preventDefault();
        if(isMoving || !gameActive) return; 
        const coords = getCoords(e);
        if(Math.hypot(coords.x - ball.x, coords.y - ball.y) < 50) {
            isDragging = true;
            dragCurrent = coords;
        }
    }
    
    function handleMove(e) { 
        if(!isDragging || !gameActive) return;
        e.preventDefault();
        dragCurrent = getCoords(e);
    }
    
    function handleUp(e) { 
        e.preventDefault();
        if(!isDragging || isMoving || !gameActive) {
            isDragging = false;
            return;
        }
        
        const dx = ball.x - dragCurrent.x;
        const dy = ball.y - dragCurrent.y;
        const force = Math.min(Math.hypot(dx, dy), 100);
        
        if(force > 5) {
            ball.vx = dx * PHYSICS.powerMult;
            ball.vy = dy * PHYSICS.powerMult;
            isMoving = true;
        }
        isDragging = false;
    }

    // Configurar eventos
    function setupEvents() {
        canvas.addEventListener('touchstart', handleDown, { passive: false });
        canvas.addEventListener('touchmove', handleMove, { passive: false });
        canvas.addEventListener('touchend', handleUp);
        canvas.addEventListener('touchcancel', handleUp);
        
        canvas.addEventListener('mousedown', handleDown);
        window.addEventListener('mousemove', (e) => {
            if(isDragging) handleMove(e);
        });
        window.addEventListener('mouseup', handleUp);
    }

    // Pantalla completa
    function setupFullscreen() {
        const btn = document.getElementById('fullscreenBtn');
        btn.addEventListener('click', () => {
            const elem = document.documentElement;
            if(elem.requestFullscreen) elem.requestFullscreen();
            else if(elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
            else if(elem.msRequestFullscreen) elem.msRequestFullscreen();
        });
    }

    // Inicialización
    function init() {
        initField();
        setupEvents();
        setupFullscreen();
        draw();
        
        document.getElementById('startBtn').onclick = startGame;
        document.getElementById('resetGameBtn').onclick = resetGame;
        document.getElementById('closeRotateBtn').onclick = () => {
            document.getElementById('rotate-overlay').style.display = 'none';
            document.querySelector('.game-container').style.filter = 'none';
            document.querySelector('.game-container').style.pointerEvents = 'auto';
        };
        
        updateUI();
    }

    init();
</script>
</body>
</html>
