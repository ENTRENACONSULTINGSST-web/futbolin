<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Futbolín Tricolor - Entrena Consulting SAS</title>

    <!-- SOLUCIÓN ERROR 404: Se eliminó la línea de og:image que causaba el error si el archivo no existía -->
    <meta property="og:title" content="Futbolín Tricolor - Entrena Consulting SAS">
    <meta property="og:description" content="¡Duelo de canicas! Expertos en SST.">
    <meta property="og:url" content="https://entrenaconsultingsst-web.github.io/futbolin/">

    <style>
        :root { --p1: #d32f2f; --p2: #1976d2; --gold: #fbc02d; }
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        body {
            background: #121212; margin: 0; overflow: hidden;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Arial, sans-serif; height: 100vh;
        }

        /* SOLUCIÓN ROTACIÓN: Overlay removible con un clic si el usuario lo desea */
        #rotate-screen {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 26, 0.95); color: white; z-index: 3000;
            flex-direction: column; justify-content: center; align-items: center; cursor: pointer;
        }
        @media (orientation: portrait) { #rotate-screen { display: flex; } }

        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #2e7d32, #1a1a1a);
            color: white; z-index: 2000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center;
        }

        .game-container {
            position: relative; display: flex; flex-direction: column;
            width: 95vw; max-width: 820px; max-height: 98vh;
            background: #3e2723; padding: 8px; border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 4px solid #2d1b18;
        }

        .ui-top {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px; color: #fff; width: 100%; flex-shrink: 0;
        }

        .stat-box {
            background: #2d1b18; padding: 4px 12px; border-radius: 15px;
            font-weight: bold; border: 1px solid #5d4037; font-size: clamp(10px, 2.5vh, 14px);
        }

        .turn { transition: 0.3s; }
        .p1-active { background: var(--p1); box-shadow: 0 0 10px var(--p1); }
        .p2-active { background: var(--p2); box-shadow: 0 0 10px var(--p2); }

        canvas {
            display: block; background: #bcaaa4; border-radius: 5px;
            cursor: crosshair; touch-action: none; 
            width: 100%; height: auto; max-height: 72vh;
            object-fit: contain; aspect-ratio: 800 / 520;
        }

        #winnerVignette {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100; border-radius: 10px;
            flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        
        .btn {
            padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer;
            border-radius: 30px; border: none; background: var(--gold); color: #000; margin-top: 10px;
        }

        /* Botón de pantalla completa sutil */
        #fs-btn { position: absolute; bottom: 15px; right: 15px; background: rgba(0,0,0,0.5); color: white; border: none; border-radius: 5px; padding: 5px; font-size: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="rotate-screen" onclick="this.style.display='none'">
    <div style="font-size: 50px;">🔄</div>
    <p>GIRA TU DISPOSITIVO</p>
    <small>(Toca para ignorar)</small>
</div>

<div id="splash-screen">
    <div style="font-size: 12px; letter-spacing: 2px;">BIENVENIDOS A</div>
    <h1 style="color:var(--gold); margin:10px 0;">ENTRENA CONSULTING SAS</h1>
    <p>Expertos en SST</p>
    <button class="btn" onclick="startGame()">INICIAR DUELO</button>
</div>

<div class="game-container" id="main-container">
    <div class="ui-top">
        <div id="turnText" class="stat-box turn p1-active">Turno: J1</div>
        <div class="stat-box" style="color:var(--gold)">⚽ <span id="score1">0</span> - <span id="score2">0</span></div>
        <div class="stat-box">⏱️ <span id="timer">60</span>s</div>
    </div>

    <canvas id="gameCanvas" width="800" height="520"></canvas>
    
    <!-- SOLUCIÓN PANTALLA COMPLETA: Botón adicional y función JS -->
    <button id="fs-btn" onclick="toggleFS()">PANTALLA COMPLETA</button>

    <div id="winnerVignette">
        <h2 id="winnerText" style="color:var(--gold)"></h2>
        <p>Entrena Consulting SAS</p>
        <button class="btn" onclick="location.reload()">REINICIAR</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 520;

    const PHYSICS = { friction: 0.988, wallBounce: 0.6, pinBounce: 0.82, powerMult: 0.16 };
    let score = [0, 0], currentPlayer = 1, timeLeft = 60, isMoving = false, isDragging = false;
    let gameActive = false, dragCurrent = {x:0,y:0}, timerInterval;

    let ball = { x: 65, y: H/2, vx: 0, vy: 0, radius: 14, angle: 0 };
    const pins = [];
    const PIN_RADIUS = 8;

    function toggleFS() {
        const elem = document.documentElement;
        if (!document.fullscreenElement) {
            elem.requestFullscreen().catch(err => { console.log("Error al activar pantalla completa"); });
        } else {
            document.exitFullscreen();
        }
    }

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        let cx = e.touches ? e.touches[0].clientX : e.clientX;
        let cy = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (cx - rect.left) * (W / rect.width),
            y: (cy - rect.top) * (H / rect.height)
        };
    }

    function initField() {
        const createFormation = (dir) => {
            const baseX = dir === 1 ? W * 0.1 : W * 0.9;
            const s = dir === 1 ? 75 : -75;
            pins.push({ x: dir === 1 ? 25 : W-25, y: H/2 }); 
            [0.2, 0.4, 0.6, 0.8].forEach(p => pins.push({ x: baseX + s, y: H*p }));
            [0.3, 0.5, 0.7].forEach(p => pins.push({ x: baseX + s*2.5, y: H*p }));
            pins.push({ x: baseX + s*3.8, y: H/2 });
            [0.38, 0.62].forEach(p => pins.push({ x: baseX + s*5.2, y: H*p }));
        };
        createFormation(1); createFormation(-1);
    }

    function drawMarble(b) {
        ctx.save(); ctx.translate(b.x, b.y);
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath();
        ctx.arc(b.vx, b.vy + 5, b.radius, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI*2);
        let g = ctx.createRadialGradient(-3, -3, 0, 0, 0, b.radius);
        g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#b2dfdb');
        ctx.fillStyle = g; ctx.fill();
        ctx.rotate(b.angle);
        const tricolor = ['#fbc02d', '#1976d2', '#d32f2f']; 
        tricolor.forEach((col, i) => {
            ctx.save(); ctx.rotate((Math.PI * 2 / 3) * i);
            ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, 0);
            ctx.bezierCurveTo(b.radius * 0.8, -b.radius * 0.5, b.radius * 0.8, b.radius * 0.5, 0, 0);
            ctx.fill(); ctx.restore();
        });
        ctx.restore(); ctx.save(); ctx.translate(b.x, b.y);
        let shine = ctx.createRadialGradient(-b.radius/2.5, -b.radius/2.5, 1, 0, 0, b.radius);
        shine.addColorStop(0, 'rgba(255,255,255,0.8)'); shine.addColorStop(1, 'rgba(0,0,0,0.05)');
        ctx.fillStyle = shine; ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function update() {
        if (!gameActive) return;
        if (isMoving) {
            const speed = Math.hypot(ball.vx, ball.vy);
            ball.angle += speed * 0.08;
            ball.x += ball.vx; ball.y += ball.vy;
            ball.vx *= PHYSICS.friction; ball.vy *= PHYSICS.friction;
            if (ball.y < ball.radius || ball.y > H - ball.radius) {
                ball.vy *= -PHYSICS.wallBounce; ball.y = ball.y < ball.radius ? ball.radius : H-ball.radius;
            }
            if (ball.x < 25 || ball.x > W - 25) {
                if (ball.y > H/2 - 60 && ball.y < H/2 + 60) {
                    if (ball.x < W/2) { score[1]++; currentPlayer = 1; } 
                    else { score[0]++; currentPlayer = 2; }
                    resetBallPosition(); return;
                } else {
                    ball.vx *= -PHYSICS.wallBounce; ball.x = ball.x < 25 ? 25 : W-25;
                }
            }
            pins.forEach(p => {
                const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy);
                if (d < ball.radius + PIN_RADIUS) {
                    const ang = Math.atan2(dy, dx), s = Math.hypot(ball.vx, ball.vy);
                    ball.vx = Math.cos(ang) * s * PHYSICS.pinBounce;
                    ball.vy = Math.sin(ang) * s * PHYSICS.pinBounce;
                    ball.x = p.x + Math.cos(ang) * (ball.radius + PIN_RADIUS + 1);
                }
            });
            if (speed < 0.2) { isMoving = false; currentPlayer = (currentPlayer === 1) ? 2 : 1; updateUI(); }
        }
    }

    function draw() {
        ctx.fillStyle = '#5d4037'; ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2;
        ctx.strokeRect(15, 15, W-30, H-30);
        ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
        ctx.beginPath(); ctx.arc(W/2, H/2, 60, 0, Math.PI*2); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.textAlign = 'center';
        ctx.font = 'bold 26px Arial'; ctx.fillText('ENTRENA CONSULTING SAS', W/2, H - 45); 
        ctx.font = 'bold 20px Arial'; ctx.fillText('JUGADOR 1', W*0.25, 60); ctx.fillText('JUGADOR 2', W*0.75, 60);
        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4;
        ctx.strokeRect(-10, H/2-60, 35, 120); ctx.strokeRect(W-25, H/2-60, 35, 120);
        pins.forEach(p => { ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.arc(p.x, p.y, PIN_RADIUS, 0, Math.PI*2); ctx.fill(); });
        if (isDragging) {
            ctx.beginPath(); ctx.strokeStyle = 'rgba(255, 255, 0, 0.6)'; 
            ctx.setLineDash([5,5]); ctx.lineWidth = 3;
            ctx.moveTo(ball.x, ball.y); ctx.lineTo(ball.x + (ball.x - dragCurrent.x), ball.y + (ball.y - dragCurrent.y));
            ctx.stroke(); ctx.setLineDash([]);
        }
        drawMarble(ball); update(); requestAnimationFrame(draw);
    }

    function startGame() {
        document.getElementById('splash-screen').style.display = 'none';
        gameActive = true; startTimer();
    }

    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!gameActive) return;
            timeLeft--; document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function resetBallPosition() {
        isMoving = false; ball.vx = 0; ball.vy = 0;
        ball.x = currentPlayer === 1 ? 65 : W - 65; ball.y = H/2;
        updateUI();
    }

    function updateUI() {
        document.getElementById('score1').innerText = score[0];
        document.getElementById('score2').innerText = score[1];
        const t = document.getElementById('turnText');
        t.innerText = `Turno: J${currentPlayer}`;
        t.className = `stat-box turn ${currentPlayer === 1 ? 'p1-active' : 'p2-active'}`;
    }

    function endGame() {
        gameActive = false; clearInterval(timerInterval);
        const vig = document.getElementById('winnerVignette');
        let win = score[0] > score[1] ? "¡VICTORIA J1!" : (score[1] > score[0] ? "¡VICTORIA J2!" : "¡EMPATE!");
        document.getElementById('winnerText').innerText = win;
        vig.style.display = 'flex';
    }

    // SOLUCIÓN LISTENERS: Eventos movidos estrictamente al canvas y manejo de fin de arrastre corregido
    function handleDown(e) { 
        if(isMoving || !gameActive) return; 
        let c = getCoords(e);
        if(Math.hypot(c.x - ball.x, c.y - ball.y) < 60) { isDragging = true; dragCurrent = c; } 
    }
    function handleMove(e) { if(isDragging) { dragCurrent = getCoords(e); e.preventDefault(); } }
    function handleUp() { 
        if(!isDragging) return; 
        ball.vx = (ball.x - dragCurrent.x) * PHYSICS.powerMult; 
        ball.vy = (ball.y - dragCurrent.y) * PHYSICS.powerMult; 
        isDragging = false; isMoving = true; 
    }

    canvas.addEventListener('mousedown', handleDown);
    canvas.addEventListener('touchstart', handleDown, {passive:false});
    
    // Los eventos de movimiento se quedan en window para permitir que el dedo se salga del canvas sin perder el tiro
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleUp);
    window.addEventListener('touchmove', handleMove, {passive:false});
    window.addEventListener('touchend', handleUp);

    initField(); updateUI(); draw();
</script>
</body>
</html>
