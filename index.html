<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Futbolín Tricolor - Entrena Consulting SAS</title>

    <style>
        :root { --p1: #d32f2f; --p2: #1976d2; --gold: #fbc02d; }
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* === OVERLAY DE ROTACIÓN CORREGIDO (TAMAÑO LEGIBLE) === */
        #rotate-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); color: white; z-index: 5000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 20px;
        }
        
        #rotate-overlay .icon { font-size: 80px; margin-bottom: 20px; }
        #rotate-overlay p { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: white; }
        #rotate-overlay span { font-size: 16px; opacity: 0.8; margin-bottom: 30px; display: block; }
        
        #rotate-overlay button {
            padding: 18px 40px; background: var(--gold);
            border: none; border-radius: 50px; font-weight: bold;
            font-size: 18px; cursor: pointer; color: black;
            box-shadow: 0 4px 15px rgba(251, 192, 45, 0.4);
        }

        /* Mostrar solo en vertical */
        @media (orientation: portrait) { #rotate-overlay { display: flex; } }

        /* === PANTALLAS DE INTERFAZ === */
        #splash-screen, #winnerVignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; z-index: 2000;
        }

        #splash-screen { background: radial-gradient(circle, #1b5e20, #0a0a0a); color: white; }
        #winnerVignette { background: rgba(0,0,0,0.97); color: white; display: none; z-index: 2500; }

        h1 { color: var(--gold); margin: 20px 0; font-size: clamp(28px, 7vw, 48px); text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        
        .game-wrapper { width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }

        .game-container {
            display: flex; flex-direction: column;
            width: 98%; height: 98%; max-width: 1200px;
            background: #3e2723; padding: 12px; border-radius: 20px;
            border: 3px solid #5d4037; position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .ui-top {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 10px; color: #fff; width: 100%; flex-shrink: 0; gap: 15px;
        }

        .stat-box {
            background: #2d1b18; padding: 10px 20px; border-radius: 40px;
            font-weight: bold; border: 1px solid #5d4037;
            font-size: clamp(14px, 4vh, 22px); min-width: 100px; text-align: center;
        }

        .turn { transition: 0.3s; min-width: 140px; }
        .p1-active { background: var(--p1); box-shadow: 0 0 15px var(--p1); }
        .p2-active { background: var(--p2); box-shadow: 0 0 15px var(--p2); }

        .canvas-wrapper {
            flex: 1; position: relative; display: flex; justify-content: center;
            align-items: center; background: #2a1a15; border-radius: 15px; overflow: hidden;
        }

        canvas { max-width: 100%; max-height: 100%; object-fit: contain; background: #bcaaa4; cursor: crosshair; }

        .control-bar { display: flex; gap: 15px; margin-top: 10px; justify-content: center; flex-shrink: 0; }

        .btn {
            padding: 12px 28px; font-size: 15px; font-weight: bold; cursor: pointer;
            border-radius: 40px; border: none; background: var(--gold); color: #000;
            min-width: 140px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<div id="rotate-overlay">
    <div class="icon">🔄</div>
    <p>GIRA TU DISPOSITIVO</p>
    <span>Usa el modo horizontal para jugar mejor</span>
    <button onclick="document.getElementById('rotate-overlay').style.display='none'">CONTINUAR ASÍ</button>
</div>

<div id="splash-screen">
    <div style="font-size: 14px; letter-spacing: 4px; opacity: 0.8;">BIENVENIDOS A</div>
    <h1>ENTRENA CONSULTING SAS</h1>
    <p style="margin-bottom: 40px; font-size: 20px; opacity: 0.9;">Expertos en Seguridad y Salud en el Trabajo</p>
    <button class="btn" onclick="startGame()" style="font-size: 22px; padding: 18px 50px;">▶ INICIAR DUELO</button>
</div>

<div class="game-wrapper">
    <div class="game-container">
        <div class="ui-top">
            <div id="turnText" class="stat-box turn p1-active">🎯 Turno: J1</div>
            <div class="stat-box" style="color:var(--gold);">⚽ <span id="score1">0</span> - <span id="score2">0</span></div>
            <div class="stat-box">⏱️ <span id="timer">60</span>s</div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="520"></canvas>
        </div>

        <div class="control-bar">
            <button class="btn" onclick="toggleFS()">⛶ Pantalla completa</button>
            <button class="btn" onclick="location.reload()">🔄 Reiniciar</button>
        </div>

        <div id="winnerVignette">
            <h2 id="winnerText" style="font-size: 48px; color: var(--gold); margin-bottom: 20px;"></h2>
            <p style="margin-bottom: 30px; font-size: 20px; opacity: 0.8;">Entrena Consulting SAS - SST</p>
            <button class="btn" onclick="location.reload()" style="font-size: 20px; padding: 15px 40px;">🎮 JUGAR DE NUEVO</button>
        </div>
    </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 520;

    const PHYSICS = { friction: 0.988, wallBounce: 0.65, pinBounce: 0.82, powerMult: 0.15 };
    const COLORS = { p1: '#d32f2f', p2: '#1976d2', gold: '#fbc02d' };
    
    let score = [0, 0], currentPlayer = 1, timeLeft = 60, isMoving = false, gameActive = false;
    let timerInterval = null, isDragging = false, dragCurrent = { x: 0, y: 0 };

    let ball = { x: 65, y: H/2, vx: 0, vy: 0, radius: 14, angle: 0 };
    const pins = [];
    const PIN_RADIUS = 8;

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const cx = e.touches ? e.touches[0].clientX : e.clientX;
        const cy = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: Math.min(Math.max(0, (cx - rect.left) * (W / rect.width)), W),
            y: Math.min(Math.max(0, (cy - rect.top) * (H / rect.height)), H)
        };
    }

    function initField() {
        pins.length = 0;
        const createFormation = (dir) => {
            const baseX = dir === 1 ? W * 0.1 : W * 0.9;
            const s = dir === 1 ? 75 : -75;
            pins.push({ x: dir === 1 ? 25 : W-25, y: H/2 }); 
            [0.2, 0.4, 0.6, 0.8].forEach(p => pins.push({ x: baseX + s, y: H * p }));
            [0.3, 0.5, 0.7].forEach(p => pins.push({ x: baseX + s * 2.5, y: H * p }));
            pins.push({ x: baseX + s * 3.8, y: H/2 });
            [0.38, 0.62].forEach(p => pins.push({ x: baseX + s * 5.2, y: H * p }));
        };
        createFormation(1); createFormation(-1);
    }

    function drawMarble(b) {
        ctx.save(); ctx.translate(b.x, b.y);
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath();
        ctx.arc(b.vx * 0.5, b.vy * 0.5 + 4, b.radius, 0, Math.PI * 2); ctx.fill();

        ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI * 2);
        let g = ctx.createRadialGradient(-4, -4, 0, 0, 0, b.radius);
        g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#80cbc4');
        ctx.fillStyle = g; ctx.fill();

        ctx.rotate(b.angle);
        const tricolor = ['#fbc02d', '#1976d2', '#d32f2f']; 
        tricolor.forEach((col, i) => {
            ctx.save(); ctx.rotate((Math.PI * 2 / 3) * i);
            ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, 0);
            ctx.bezierCurveTo(b.radius * 0.7, -b.radius * 0.5, b.radius * 0.7, b.radius * 0.5, 0, 0);
            ctx.fill(); ctx.restore();
        });
        ctx.restore();
        
        ctx.save(); ctx.translate(b.x, b.y);
        let shine = ctx.createRadialGradient(-b.radius/3, -b.radius/3, 2, 0, 0, b.radius);
        shine.addColorStop(0, 'rgba(255,255,255,0.8)'); shine.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = shine; ctx.beginPath(); ctx.arc(0, 0, b.radius - 2, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function update() {
        if (!gameActive) return;
        if (isMoving) {
            const speed = Math.hypot(ball.vx, ball.vy);
            ball.angle += speed * 0.1;
            ball.x += ball.vx; ball.y += ball.vy;
            ball.vx *= PHYSICS.friction; ball.vy *= PHYSICS.friction;

            if (ball.y < ball.radius || ball.y > H - ball.radius) {
                ball.vy *= -PHYSICS.wallBounce; ball.y = ball.y < ball.radius ? ball.radius : H-ball.radius;
            }
            
            const goalZone = 70;
            if (ball.x < 30 && Math.abs(ball.y - H/2) < goalZone) {
                score[1]++; currentPlayer = 1; resetBallPosition(); return;
            }
            if (ball.x > W - 30 && Math.abs(ball.y - H/2) < goalZone) {
                score[0]++; currentPlayer = 2; resetBallPosition(); return;
            }
            
            if (ball.x < ball.radius || ball.x > W - ball.radius) {
                ball.vx *= -PHYSICS.wallBounce; ball.x = ball.x < ball.radius ? ball.radius : W-ball.radius;
            }

            pins.forEach(p => {
                const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy);
                if (d < ball.radius + PIN_RADIUS) {
                    const ang = Math.atan2(dy, dx), s = Math.hypot(ball.vx, ball.vy);
                    ball.vx = Math.cos(ang) * s * PHYSICS.pinBounce;
                    ball.vy = Math.sin(ang) * s * PHYSICS.pinBounce;
                    const overlap = (ball.radius + PIN_RADIUS) - d;
                    ball.x += Math.cos(ang) * overlap; ball.y += Math.sin(ang) * overlap;
                }
            });

            if (speed < 0.5) { 
                ball.vx = 0; ball.vy = 0; isMoving = false; 
                currentPlayer = (currentPlayer === 1) ? 2 : 1; updateUI(); 
            }
        }
    }

    function draw() {
        ctx.fillStyle = '#4e342e'; ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 2;
        ctx.strokeRect(15, 15, W-30, H-30);
        ctx.beginPath(); ctx.moveTo(W/2, 10); ctx.lineTo(W/2, H-10); ctx.stroke();
        ctx.beginPath(); ctx.arc(W/2, H/2, 60, 0, Math.PI*2); ctx.stroke();
        
        ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.textAlign = 'center';
        ctx.font = 'bold 22px Arial'; ctx.fillText('ENTRENA CONSULTING SAS', W/2, H - 35);
        ctx.font = 'bold 18px Arial';
        ctx.fillStyle = (currentPlayer === 1 && !isMoving) ? COLORS.p1 : '#aaa';
        ctx.fillText('JUGADOR 1', W*0.25, 50);
        ctx.fillStyle = (currentPlayer === 2 && !isMoving) ? COLORS.p2 : '#aaa';
        ctx.fillText('JUGADOR 2', W*0.75, 50);

        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4;
        ctx.strokeRect(-5, H/2-60, 30, 120); ctx.strokeRect(W-25, H/2-60, 30, 120);
        
        pins.forEach(p => {
            ctx.fillStyle = '#1a1a1a'; ctx.beginPath(); ctx.arc(p.x, p.y, PIN_RADIUS, 0, Math.PI*2); ctx.fill();
        });

        if (isDragging && !isMoving && gameActive) {
            const dx = ball.x - dragCurrent.x, dy = ball.y - dragCurrent.y, force = Math.min(Math.hypot(dx, dy), 100);
            ctx.beginPath(); ctx.strokeStyle = `rgba(255, 215, 0, ${0.4 + force/150})`;
            ctx.setLineDash([6, 10]); ctx.lineWidth = 3;
            ctx.moveTo(ball.x, ball.y); ctx.lineTo(ball.x + dx * 1.8, ball.y + dy * 1.8);
            ctx.stroke(); ctx.setLineDash([]);
        }

        drawMarble(ball); update(); requestAnimationFrame(draw);
    }

    window.startGame = function() {
        document.getElementById('splash-screen').style.display = 'none';
        gameActive = true; score = [0, 0]; currentPlayer = 1; timeLeft = 60;
        resetBallPosition(); startTimer();
    };

    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!gameActive) return;
            if (timeLeft > 0) { timeLeft--; document.getElementById('timer').innerText = timeLeft; }
            else endGame();
        }, 1000);
    }

    function resetBallPosition() {
        isMoving = false; isDragging = false; ball.vx = 0; ball.vy = 0;
        ball.x = currentPlayer === 1 ? 65 : W - 65; ball.y = H/2; updateUI();
    }

    function updateUI() {
        document.getElementById('score1').innerText = score[0];
        document.getElementById('score2').innerText = score[1];
        const t = document.getElementById('turnText');
        t.innerText = `🎯 Turno: J${currentPlayer}`;
        t.className = `stat-box turn ${currentPlayer === 1 ? 'p1-active' : 'p2-active'}`;
    }

    function endGame() {
        gameActive = false; clearInterval(timerInterval);
        const vig = document.getElementById('winnerVignette');
        vig.querySelector('h2').innerText = score[0] > score[1] ? "🏆 VICTORIA J1" : (score[1] > score[0] ? "🏆 VICTORIA J2" : "EMPATE");
        vig.style.display = 'flex';
    }

    window.toggleFS = function() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        else document.exitFullscreen();
    };

    canvas.addEventListener('mousedown', (e) => {
        if(isMoving || !gameActive) return;
        const c = getCoords(e);
        if(Math.hypot(c.x - ball.x, c.y - ball.y) < 55) { isDragging = true; dragCurrent = c; }
    });
    window.addEventListener('mousemove', (e) => { if(isDragging) dragCurrent = getCoords(e); });
    window.addEventListener('mouseup', () => {
        if(!isDragging) return;
        const dx = ball.x - dragCurrent.x, dy = ball.y - dragCurrent.y;
        if(Math.hypot(dx, dy) > 8) { ball.vx = dx * PHYSICS.powerMult; ball.vy = dy * PHYSICS.powerMult; isMoving = true; }
        isDragging = false;
    });

    canvas.addEventListener('touchstart', (e) => {
        if(isMoving || !gameActive) return;
        const c = getCoords(e);
        if(Math.hypot(c.x - ball.x, c.y - ball.y) < 55) { isDragging = true; dragCurrent = c; }
    }, {passive: false});
    window.addEventListener('touchmove', (e) => { if(isDragging) { e.preventDefault(); dragCurrent = getCoords(e); } }, {passive: false});
    window.addEventListener('touchend', () => {
        if(!isDragging) return;
        const dx = ball.x - dragCurrent.x, dy = ball.y - dragCurrent.y;
        if(Math.hypot(dx, dy) > 8) { ball.vx = dx * PHYSICS.powerMult; ball.vy = dy * PHYSICS.powerMult; isMoving = true; }
        isDragging = false;
    });

    initField(); updateUI(); draw();
})();
</script>
</body>
</html>
