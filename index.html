<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Futbolín Tricolor - Entrena Consulting SAS</title>

    <style>
        :root { --p1: #d32f2f; --p2: #1976d2; --gold: #fbc02d; }
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: #0a0a0a;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* === PANTALLAS DE INTERFAZ === */
        #splash-screen, #winnerVignette, #rotate-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; z-index: 2000;
        }

        #splash-screen { background: radial-gradient(circle, #1b5e20, #0a0a0a); color: white; }
        #winnerVignette { background: rgba(0,0,0,0.95); color: white; display: none; }
        #rotate-overlay { background: rgba(0,0,0,0.9); color: white; display: none; z-index: 3000; }

        h1 { color: var(--gold); margin: 20px 0; font-size: clamp(24px, 6vw, 42px); }
        
        /* === CONTENEDOR PRINCIPAL RESPONSIVO === */
        .game-wrapper {
            width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center;
        }

        .game-container {
            display: flex; flex-direction: column;
            width: 98%; height: 98%; max-width: 1200px;
            background: #3e2723; padding: 10px; border-radius: 15px;
            border: 3px solid #5d4037; position: relative;
        }

        .ui-top {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; color: #fff; width: 100%; flex-shrink: 0; gap: 10px;
        }

        .stat-box {
            background: #2d1b18; padding: 8px 15px; border-radius: 30px;
            font-weight: bold; border: 1px solid #5d4037;
            font-size: clamp(14px, 3vh, 20px); min-width: 80px; text-align: center;
        }

        .turn { transition: 0.3s; min-width: 120px; }
        .p1-active { background: var(--p1); box-shadow: 0 0 15px var(--p1); }
        .p2-active { background: var(--p2); box-shadow: 0 0 15px var(--p2); }

        /* === ÁREA DE JUEGO === */
        .canvas-wrapper {
            flex: 1; position: relative; display: flex; justify-content: center;
            align-items: center; background: #2a1a15; border-radius: 10px; overflow: hidden;
        }

        canvas {
            max-width: 100%; max-height: 100%; object-fit: contain;
            background: #bcaaa4; border-radius: 5px; cursor: crosshair;
        }

        .control-bar {
            display: flex; gap: 15px; margin-top: 10px; justify-content: center; flex-shrink: 0;
        }

        .btn {
            padding: 10px 25px; font-size: 14px; font-weight: bold; cursor: pointer;
            border-radius: 30px; border: none; background: var(--gold); color: #000;
            min-width: 120px;
        }

        @media (orientation: portrait) {
            #rotate-overlay { display: flex; }
        }
    </style>
</head>
<body>

<div id="rotate-overlay" onclick="this.style.display='none'">
    <div style="font-size: 60px;">🔄</div>
    <p style="margin: 20px; font-size: 20px;">GIRA A HORIZONTAL</p>
    <button class="btn">IGNORAR</button>
</div>

<div id="splash-screen">
    <div style="font-size: 14px; letter-spacing: 3px;">BIENVENIDOS A</div>
    <h1>ENTRENA CONSULTING SAS</h1>
    <p style="margin-bottom: 30px;">Expertos en Seguridad y Salud en el Trabajo</p>
    <button class="btn" onclick="startGame()" style="font-size: 20px; padding: 15px 40px;">INICIAR DUELO</button>
</div>

<div class="game-wrapper">
    <div class="game-container">
        <div class="ui-top">
            <div id="turnText" class="stat-box turn p1-active">Turno: J1</div>
            <div class="stat-box" style="color:var(--gold);">⚽ <span id="score1">0</span> - <span id="score2">0</span></div>
            <div class="stat-box">⏱️ <span id="timer">60</span>s</div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="520"></canvas>
        </div>

        <div class="control-bar">
            <button class="btn" onclick="toggleFS()">PANTALLA COMPLETA</button>
            <button class="btn" onclick="location.reload()">REINICIAR</button>
        </div>

        <div id="winnerVignette">
            <h2 id="winnerText" style="font-size: 40px; color: var(--gold); margin-bottom: 15px;"></h2>
            <p style="margin-bottom: 25px;">Entrena Consulting SAS - SST</p>
            <button class="btn" onclick="location.reload()">JUGAR DE NUEVO</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const W = 800, H = 520;

    const PHYSICS = { friction: 0.988, wallBounce: 0.6, pinBounce: 0.82, powerMult: 0.16 };
    let score = [0, 0], currentPlayer = 1, timeLeft = 60, isMoving = false, isDragging = false;
    let gameActive = false, timerInterval, dragCurrent = {x:0, y:0};

    let ball = { x: 65, y: H/2, vx: 0, vy: 0, radius: 14, angle: 0 };
    const pins = [];
    const PIN_RADIUS = 8;

    function getCoords(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (W / rect.width),
            y: (clientY - rect.top) * (H / rect.height)
        };
    }

    function initField() {
        const createFormation = (dir) => {
            const baseX = dir === 1 ? W * 0.1 : W * 0.9;
            const s = dir === 1 ? 75 : -75;
            pins.push({ x: dir === 1 ? 25 : W-25, y: H/2 }); 
            [0.2, 0.4, 0.6, 0.8].forEach(p => pins.push({ x: baseX + s, y: H*p }));
            [0.3, 0.5, 0.7].forEach(p => pins.push({ x: baseX + s*2.5, y: H*p }));
            pins.push({ x: baseX + s*3.8, y: H/2 });
            [0.38, 0.62].forEach(p => pins.push({ x: baseX + s*5.2, y: H*p }));
        };
        createFormation(1); createFormation(-1);
    }

    function drawMarble(b) {
        ctx.save(); ctx.translate(b.x, b.y);
        ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath();
        ctx.arc(b.vx, b.vy + 5, b.radius, 0, Math.PI*2); ctx.fill();

        ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI*2);
        let g = ctx.createRadialGradient(-3, -3, 0, 0, 0, b.radius);
        g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#b2dfdb');
        ctx.fillStyle = g; ctx.fill();

        ctx.rotate(b.angle);
        const tricolor = ['#fbc02d', '#1976d2', '#d32f2f']; 
        tricolor.forEach((col, i) => {
            ctx.save(); ctx.rotate((Math.PI * 2 / 3) * i);
            ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, 0);
            ctx.bezierCurveTo(b.radius * 0.8, -b.radius * 0.5, b.radius * 0.8, b.radius * 0.5, 0, 0);
            ctx.fill(); ctx.restore();
        });

        ctx.restore(); ctx.save(); ctx.translate(b.x, b.y);
        let shine = ctx.createRadialGradient(-b.radius/2.5, -b.radius/2.5, 1, 0, 0, b.radius);
        shine.addColorStop(0, 'rgba(255,255,255,0.8)'); shine.addColorStop(1, 'rgba(0,0,0,0.05)');
        ctx.fillStyle = shine; ctx.beginPath(); ctx.arc(0, 0, b.radius, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    }

    function update() {
        if (!gameActive) return;
        if (isMoving) {
            const speed = Math.hypot(ball.vx, ball.vy);
            ball.angle += speed * 0.08;
            ball.x += ball.vx; ball.y += ball.vy;
            ball.vx *= PHYSICS.friction; ball.vy *= PHYSICS.friction;

            if (ball.y < ball.radius || ball.y > H - ball.radius) {
                ball.vy *= -PHYSICS.wallBounce; ball.y = ball.y < ball.radius ? ball.radius : H-ball.radius;
            }
            
            if (ball.x < 25 || ball.x > W - 25) {
                if (ball.y > H/2 - 60 && ball.y < H/2 + 60) {
                    if (ball.x < W/2) { score[1]++; currentPlayer = 1; } 
                    else { score[0]++; currentPlayer = 2; }
                    resetBallPosition(); return;
                } else {
                    ball.vx *= -PHYSICS.wallBounce; ball.x = ball.x < 25 ? 25 : W-25;
                }
            }

            pins.forEach(p => {
                const dx = ball.x - p.x, dy = ball.y - p.y, d = Math.hypot(dx, dy);
                if (d < ball.radius + PIN_RADIUS) {
                    const ang = Math.atan2(dy, dx), s = Math.hypot(ball.vx, ball.vy);
                    ball.vx = Math.cos(ang) * s * PHYSICS.pinBounce;
                    ball.vy = Math.sin(ang) * s * PHYSICS.pinBounce;
                    ball.x = p.x + Math.cos(ang) * (ball.radius + PIN_RADIUS + 1);
                }
            });

            if (speed < 0.2) { 
                isMoving = false; currentPlayer = (currentPlayer === 1) ? 2 : 1; 
                updateUI(); 
            }
        }
    }

    function draw() {
        ctx.fillStyle = '#5d4037'; ctx.fillRect(0, 0, W, H);
        ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 2;
        ctx.strokeRect(15, 15, W-30, H-30);
        ctx.beginPath(); ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.stroke();
        ctx.beginPath(); ctx.arc(W/2, H/2, 60, 0, Math.PI*2); ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.textAlign = 'center';
        ctx.font = 'bold 26px Arial'; ctx.fillText('ENTRENA CONSULTING SAS', W/2, H - 45); 
        ctx.font = 'bold 20px Arial';
        ctx.fillText('JUGADOR 1', W*0.25, 60); ctx.fillText('JUGADOR 2', W*0.75, 60);

        ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 4;
        ctx.strokeRect(-10, H/2-60, 35, 120); ctx.strokeRect(W-25, H/2-60, 35, 120);

        pins.forEach(p => {
            ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.arc(p.x, p.y, PIN_RADIUS, 0, Math.PI*2); ctx.fill();
        });

        if (isDragging && !isMoving) {
            ctx.beginPath(); ctx.strokeStyle = 'rgba(255, 255, 0, 0.6)'; 
            ctx.setLineDash([5,5]); ctx.lineWidth = 3;
            ctx.moveTo(ball.x, ball.y); 
            ctx.lineTo(ball.x + (ball.x - dragCurrent.x), ball.y + (ball.y - dragCurrent.y));
            ctx.stroke(); ctx.setLineDash([]);
        }

        drawMarble(ball); update(); requestAnimationFrame(draw);
    }

    function startGame() {
        document.getElementById('splash-screen').style.display = 'none';
        gameActive = true; startTimer();
    }

    function startTimer() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (!gameActive) return;
            timeLeft--; document.getElementById('timer').innerText = timeLeft;
            if (timeLeft <= 0) endGame();
        }, 1000);
    }

    function resetBallPosition() {
        isMoving = false; ball.vx = 0; ball.vy = 0;
        ball.x = currentPlayer === 1 ? 65 : W - 65; ball.y = H/2;
        updateUI();
    }

    function updateUI() {
        document.getElementById('score1').innerText = score[0];
        document.getElementById('score2').innerText = score[1];
        const t = document.getElementById('turnText');
        t.innerText = `Turno: J${currentPlayer}`;
        t.className = `stat-box turn ${currentPlayer === 1 ? 'p1-active' : 'p2-active'}`;
    }

    function endGame() {
        gameActive = false; clearInterval(timerInterval);
        const vig = document.getElementById('winnerVignette');
        let win = score[0] > score[1] ? "¡VICTORIA J1!" : (score[1] > score[0] ? "¡VICTORIA J2!" : "¡EMPATE!");
        document.getElementById('winnerText').innerText = win;
        vig.style.display = 'flex';
    }

    function toggleFS() {
        const elem = document.documentElement;
        if (!document.fullscreenElement) {
            elem.requestFullscreen().catch(() => {});
        } else {
            document.exitFullscreen();
        }
    }

    // EVENTOS CONSOLIDADOS
    function handleDown(e) { 
        if(isMoving || !gameActive) return; 
        let c = getCoords(e);
        if(Math.hypot(c.x - ball.x, c.y - ball.y) < 55) { isDragging = true; dragCurrent = c; } 
    }
    function handleMove(e) { if(isDragging) { dragCurrent = getCoords(e); e.preventDefault(); } }
    function handleUp() { 
        if(!isDragging) return; 
        ball.vx = (ball.x - dragCurrent.x) * PHYSICS.powerMult; 
        ball.vy = (ball.y - dragCurrent.y) * PHYSICS.powerMult; 
        isDragging = false; isMoving = true; 
    }

    canvas.addEventListener('mousedown', handleDown);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleUp);
    canvas.addEventListener('touchstart', handleDown, {passive:false});
    window.addEventListener('touchmove', handleMove, {passive:false});
    window.addEventListener('touchend', handleUp);

    initField(); updateUI(); draw();
</script>
</body>
</html>
